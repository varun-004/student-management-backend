services:

  mysql:
    image: mysql:8.0
    container_name: student-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: student_management_db
    ports:
      - "3306:3306"
    volumes:
      - student-mysql-data:/var/lib/mysql
    networks:
      - student-network

  backend:
    image: student-management-backend:latest
    container_name: student-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_management_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "8080:8080"
    networks:
      - student-network

  frontend:
    image: student-management-frontend:latest
    container_name: student-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - student-network

volumes:
  student-mysql-data:

networks:
  student-network:
    driver: bridge
